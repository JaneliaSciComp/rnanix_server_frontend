name: Deploy to GitHub Pages

# No manual setup needed: configure-pages' enablement:true below has this workflow turn on
# Pages (source = GitHub Actions) itself on first run, via the GITHUB_TOKEN's pages:write
# permission. If your org's policies block that self-enable, do it once manually instead:
#   repo Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload repo root as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
